<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Domus Meriti · Owner Sheet</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--line:#26263a;--txt:#ececf3;--mut:#9a9ab0;--acc:#8b5cf6;--acc2:#6366f1;--ok:#22c55e;--warn:#f59e0b;--hold:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0b12ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;font-weight:800}
h1{font-size:17px;margin:0}h1 small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
input[type=search]{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:14px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border-color:transparent}
.sep{width:1px;height:22px;background:var(--line)}
main{padding:16px 18px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.co{font-weight:700;font-size:15px}.ca{color:var(--mut);font-size:12.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.Active{color:var(--ok);border-color:#22c55e55}.tag.hold{color:var(--hold);border-color:#ef444455}
.comm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cm{background:#0f0f19;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.cm b{display:block;font-size:16px}.cm span{font-size:11px;color:var(--mut)}
.cm.um b{color:#c4b5fd}
.kv{font-size:12.5px;color:var(--mut)}.kv b{color:var(--txt);font-weight:600}
.kv a{color:#a5b4fc}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
pre{white-space:pre-wrap;word-wrap:break-word;background:#0f0f19;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.55 system-ui,Arial;margin:8px 0 0;max-height:320px;overflow:auto;unicode-bidi:plaintext}
.btn{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;border:0;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.btn.done{background:var(--ok)}
.none{color:var(--mut);font-size:12.5px;font-style:italic}
.count{color:var(--mut);font-size:12px;margin-left:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px}

.upd{font-size:11px;color:var(--mut)}
.btn.done{background:var(--ok)}

.comm{grid-template-columns:repeat(3,1fr);gap:8px}
.cm{padding:10px 6px 9px;position:relative}
.ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px}
.ic svg{width:19px;height:19px}
.cm.r .ic{background:#3b82f622;color:#60a5fa;box-shadow:inset 0 0 0 1px #3b82f655}
.cm.t .ic{background:#14b8a622;color:#2dd4bf;box-shadow:inset 0 0 0 1px #14b8a655}
.cm.um .ic{background:#f59e0b22;color:#fbbf24;box-shadow:inset 0 0 0 1px #f59e0b55}
.cm.r b{color:#93c5fd}.cm.t b{color:#5eead4}.cm.um b{color:#fcd34d}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;gap:9px;align-items:flex-start;background:#0f0f19;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.tile.w{grid-column:1/-1}
.tb{flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.tl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tv{font-size:13px;font-weight:600;word-break:break-word}
.amber .tb{background:#f59e0b22}.pink .tb{background:#ec489922}.indigo .tb{background:#6366f122}.green .tb{background:#22c55e22}.gray .tb{background:#9a9ab022}
.wk{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.wk span{font-size:10.5px;font-weight:700;width:30px;text-align:center;padding:3px 0;border-radius:6px;background:#1c1c2b;color:#55556a}
.wk span.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.slot{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#22c55e1f;color:#4ade80;border:1px solid #22c55e44}
.map{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#101722;min-height:96px;display:flex;align-items:flex-end}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.map .mi{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;width:100%;padding:10px;background:linear-gradient(0deg,#0b0b12ee 40%,transparent)}
.map .ml{font-size:12.5px;font-weight:600;line-height:1.35}
.map .ml small{display:block;font-size:10.5px;color:var(--mut);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.mbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#111;font-weight:700;font-size:12px;border-radius:999px;padding:6px 12px;text-decoration:none}
.mbtn i{width:8px;height:8px;border-radius:50%;background:#ea4335;display:inline-block}
.fbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#c4b5fd;background:#8b5cf61a;border:1px solid #8b5cf655;border-radius:8px;padding:6px 10px;text-decoration:none;align-self:flex-start}

.sw{position:relative;flex:1;min-width:200px;display:flex}.sw input{flex:1}
.dd{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;background:#14141f;border:1px solid #3a3a55;border-radius:12px;box-shadow:0 14px 40px -10px #000c;max-height:340px;overflow:auto;padding:6px}
.dd.on{display:block}
.ddi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.ddi:hover,.ddi.sel{background:#8b5cf622}
.ddi b{font-size:13.5px}.ddi small{display:block;color:var(--mut);font-size:12px}
.ddt{display:flex;gap:5px;flex-shrink:0}
.ddi mark{background:#8b5cf655;color:#fff;border-radius:3px;padding:0 1px}
.ddn{color:var(--mut);font-size:12.5px;padding:10px;text-align:center}
.card.hl{border-color:#8b5cf6;box-shadow:0 0 0 2px #8b5cf655}
